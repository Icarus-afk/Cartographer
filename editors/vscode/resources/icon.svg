<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background rounded square -->
  <rect x="2" y="2" width="124" height="124" rx="24" fill="#0e1118" stroke="#1e293b" stroke-width="2"/>
  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="0.6">
    <line x1="32" y1="0" x2="32" y2="128"/><line x1="64" y1="0" x2="64" y2="128"/><line x1="96" y1="0" x2="96" y2="128"/>
    <line x1="0" y1="32" x2="128" y2="32"/><line x1="0" y1="64" x2="128" y2="64"/><line x1="0" y1="96" x2="128" y2="96"/>
  </g>
  <!-- Outer glow -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="#0ea5e9" stroke-opacity="0.12" stroke-width="8"/>
  <!-- Connection lines -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <line x1="64" y1="36" x2="36" y2="84" stroke="#38bdf8" stroke-width="3" opacity="0.9"/>
    <line x1="64" y1="36" x2="92" y2="84" stroke="#38bdf8" stroke-width="3" opacity="0.9"/>
    <line x1="36" y1="84" x2="92" y2="84" stroke="#38bdf8" stroke-width="2.5" opacity="0.6"/>
    <line x1="64" y1="64" x2="36" y2="84" stroke="#10b981" stroke-width="2.2" opacity="0.85"/>
    <line x1="64" y1="64" x2="92" y2="84" stroke="#10b981" stroke-width="2.2" opacity="0.85"/>
    <line x1="64" y1="64" x2="64" y2="36" stroke="#10b981" stroke-width="2.2" opacity="0.85"/>
  </g>
  <!-- Central hub node -->
  <circle cx="64" cy="64" r="14" fill="#0ea5e9" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="5" fill="#ffffff" opacity="0.95"/>
  <!-- Top node -->
  <circle cx="64" cy="30" r="11" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="64" cy="30" r="4" fill="#ffffff" opacity="0.9"/>
  <!-- Bottom left -->
  <circle cx="34" cy="88" r="11" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <circle cx="34" cy="88" r="4" fill="#ffffff" opacity="0.9"/>
  <!-- Bottom right -->
  <circle cx="94" cy="88" r="11" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <circle cx="94" cy="88" r="4" fill="#ffffff" opacity="0.9"/>
  <!-- Small accent dots -->
  <circle cx="64" cy="14" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="18" cy="68" r="1.6" fill="#10b981" opacity="0.5"/>
  <circle cx="110" cy="52" r="1.6" fill="#f59e0b" opacity="0.5"/>
</svg>
